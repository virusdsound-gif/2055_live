name: 2055_live CI

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install || true

      - name: Install Solidity compiler
        run: npm install -g solc || true

      - name: Prepare runtime
        run: |
          mkdir -p exports
          mkdir -p timelines
          mkdir -p state
          mkdir -p build

      - name: Check files
        run: ls -la

      - name: Validate CLI
        run: |
          node bin/dsound.js status || true

      - name: Compile MorningStar
        run: |
          if [ -f hardhat-project/contracts/MorningStar.sol ]; then
            solcjs \
              --bin \
              --abi \
              --include-path node_modules \
              --base-path . \
              hardhat-project/contracts/MorningStar.sol \
              -o build || echo "Compile soft-failed (non-blocking)"
          elif [ -f MorningStar.sol ]; then
            solcjs --bin --abi MorningStar.sol -o build || true
          else
            echo "MorningStar.sol not found — skip compile"
          fi

      - name: Generate tree
        run: |
          sudo apt-get update -y
          sudo apt-get install -y tree
          tree -L 3 > project-tree.txt || true

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: 2055-live-artifacts
          path: |
            exports/
            state/
            build/
            project-tree.txt
          if-no-files-found: warn

      - name: Finish
        run: echo "2055_live pipeline complete"
