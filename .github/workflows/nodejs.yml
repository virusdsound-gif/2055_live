name: 2055_live CI

on:

  push:
    branches:
      - main

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install || true

      - name: Create runtime folders
        run: |
          mkdir -p exports
          mkdir -p state
          mkdir -p timelines

      - name: Validate CLI
        run: |
          node bin/dsound.js status || true

      - name: Validate timelines
        run: |
          python timelines/loader.py || true

      - name: Workflow completed
        run: echo "2055_live CI complete"
