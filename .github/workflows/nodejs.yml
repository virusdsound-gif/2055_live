name: 2055_live CI

on:
  push:
    branches:
      - main

jobs:

  build:

    runs-on: ubuntu-latest

    continue-on-error: true

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: npm install || true

      - name: Prepare runtime
        run: |
          mkdir -p exports
          mkdir -p timelines
          mkdir -p state

      - name: Check files
        run: ls -la

      - name: Validate CLI
        run: |
          node bin/dsound.js status || true

      - name: Finish
        run: echo "2055_live pipeline complete"
