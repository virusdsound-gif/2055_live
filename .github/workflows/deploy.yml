name: Deploy to Polygon Amoy Testnet

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4 pinned

      - name: Setup Node.js
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b   # v4 pinned

      - name: Install dependencies
        run: |
          cd hardhat-project || true
          npm ci

      - name: Compile contracts
        run: |
          cd hardhat-project || true
          npx hardhat compile

      - name: Deploy to Amoy Testnet
        run: |
          cd hardhat-project || true
          npx hardhat run scripts/deploy.js --network amoy
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
