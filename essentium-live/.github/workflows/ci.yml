name: Essentium Grid CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install web3 python-dotenv

      - name: Run Simulation
        run: python essentium_simulation.py

      - name: Run Timeline Loader
        run: python timelines/loader.py

      - name: Check CLI
        run: |
          chmod +x dsound
          ./dsound status
          ./dsound beat

  # Solidity Compilation (if hardhat-project exists)
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Compile Contracts
        run: |
          if [ -d "hardhat-project" ]; then
            cd hardhat-project
            npm ci
            npx hardhat compile
          fi
